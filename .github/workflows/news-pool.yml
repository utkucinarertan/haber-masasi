name: Haber havuzu

# Kaynaklardan son haberleri toplayıp docs/data/feeds.json'a yazar (anahtar gerekmez).
# Uygulama "Güncelle" dendiğinde ya da sabah ilk açıldığında bu havuzu cihazda özetler.
on:
  schedule:
    - cron: "40 3-20 * * *"   # Türkiye saatiyle 06:40-23:40 arası saatte bir
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-pool
  cancel-in-progress: false

jobs:
  pool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Haberleri topla
        run: python scripts/build_news.py --pool
      - name: Kaydet
        run: |
          git config user.name "haber-masasi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data
          git diff --cached --quiet && exit 0
          git commit -q -m "Haber havuzu $(TZ=Europe/Istanbul date '+%F %H:%M')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
