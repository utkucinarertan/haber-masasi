name: Günlük haber baskısı

# Saatte bir çalışır; betik yalnızca yönetim sayfasında ayarlanan saatten sonra ve o günün baskısı
# henüz yoksa üretir (docs/data/config.json → time). Ülkeler, kaynaklar ve diller de oradan gelir.
# Haberler ücretsiz Google Gemini ile özetlenir. Gerekli secret: GEMINI_API_KEY (yönetim sayfasından kaydedilir).
on:
  schedule:
    - cron: "2 * * * *"
  push:
    paths: ["docs/data/config.json"]   # ayarlar değişince bugünün baskısı yoksa hemen dene
  workflow_dispatch: {}   # yönetim sayfasındaki "Şimdi hazırla" düğmesi (saate bakmadan üretir)

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Haberleri derle ve özetle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build_news.py

      - name: Yeni baskıyı kaydet
        run: |
          git config user.name "haber-masasi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data
          git diff --cached --quiet && exit 0
          git commit -q -m "Günlük baskı $(TZ=Europe/Istanbul date +%F)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
