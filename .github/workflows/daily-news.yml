name: Günlük haber baskısı

# Her sabah 07:00'de (Türkiye) haberleri toplar, ücretsiz Google Gemini ile Türkçe özetler
# ve docs/data altına yazar. Uygulamayı kullanan herkes bu baskıyı okur; kimsenin anahtar girmesi gerekmez.
# Gerekli secret: GEMINI_API_KEY (Settings → Secrets and variables → Actions).
on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 07:00 Türkiye
  workflow_dispatch: {}   # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Haberleri derle ve özetle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build_news.py

      - name: Yeni baskıyı kaydet
        run: |
          git config user.name "haber-masasi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data
          git diff --cached --quiet && exit 0
          git commit -q -m "Günlük baskı $(TZ=Europe/Istanbul date +%F)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
