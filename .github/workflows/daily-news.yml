name: Günlük haber baskısı

# Yalnızca yönetim sayfasındaki "Şimdi hazırla" düğmesi için: bugünün baskısını saate bakmadan
# tüm ülkeler için hemen yeniden üretir ve son dakikayı günceller.
# Düzenli işleri (sabah baskısı, 30 dakikada bir son dakika, eksik ülke tamamlama, ayar
# değişikliklerini uygulama) sürekli çalışan "Haber döngüsü" (news-loop.yml) yapar.
# Haberler ücretsiz Google Gemini ile özetlenir. Gerekli secret: GEMINI_API_KEY (yönetim sayfasından kaydedilir).
on:
  workflow_dispatch:
    inputs:
      flash_only:
        description: "Yalnızca son dakikayı güncelle (baskıya dokunma)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Haberleri derle ve özetle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build_news.py ${{ inputs.flash_only && '--flash-only' || '' }}

      - name: Yeni baskıyı kaydet
        run: |
          git config user.name "haber-masasi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data
          git diff --cached --quiet && exit 0
          git commit -q -m "Haber güncellemesi $(TZ=Europe/Berlin date '+%F %H:%M') (Almanya)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
