name: Sabah baskısı

# Günlük baskıyı ayarlanan saatte (config.json → time, timezone; varsayılan 06:00 Almanya) hazır eder.
# GitHub zamanlanmış işleri saatlerce geciktirebildiği için akşam ve gece boyunca birçok kez tetiklenir;
# ilk gelen çalıştırma üretim saatine (hazır olma saatinden 45 dk önce) kadar bekler, sonra tüm ülkeleri
# üretir. Bir ülke başarısız olursa süre dolana kadar yeniden dener. Üretim saati 5,5 saatten uzaksa
# bir süre uyuyup kendini yeniden başlatır (workflow_dispatch gecikmeden çalışır).
on:
  schedule:
    - cron: "13,43 16-23 * * *"
    - cron: "13,43 0-4 * * *"
  push:
    paths: [".github/workflows/morning-edition.yml"]   # iş akışı değişince bekleyen sabah işini başlat
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: morning-edition
  cancel-in-progress: false

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Üretim saatini bekle
        id: wait
        run: python scripts/build_news.py --wait

      - name: Sabah işini yeniden başlat
        if: steps.wait.outputs.chain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run morning-edition.yml --ref "${{ github.ref_name }}" --repo "${{ github.repository }}"

      - name: Baskıyı hazırla (eksik ülke kalmayana kadar)
        if: steps.wait.outputs.go == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git pull -q --rebase
          python scripts/build_news.py --morning --no-flash

      - name: Baskıyı kaydet
        if: always() && steps.wait.outputs.go == 'true'
        run: |
          git config user.name "haber-masasi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data
          git diff --cached --quiet && exit 0
          git commit -q -m "Sabah baskısı $(TZ=Europe/Berlin date '+%F %H:%M') (Almanya)"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep 7; done
          exit 1
