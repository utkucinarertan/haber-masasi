name = "haber-masasi-konular"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# uygulamanın yayınladığı veri klasörü (konu havuzu: pool/<ülke>.json)
DATA_BASE = "https://utkucinarertan.github.io/haber-masasi/data/"

# Kendi konularının özetleri ve konu kaydı. Kurulumda `npx wrangler kv namespace create TOPICS`
# komutunun verdiği id buraya yazılır.
[[kv_namespaces]]
binding = "TOPICS"
id = "BURAYA_KV_ID"

# Sabah yenilemesi: Almanya saatiyle 05:00-06:59 arası (yaz/kış saati için 03-05 UTC) 10 dakikada bir;
# her çalışma en fazla 15 özet yeniler, zaten bugünkü olanlara dokunmaz.
[triggers]
crons = ["*/10 3-5 * * *"]
